# stack-encrypt WASI guest: `StackCipher` over host-provided HTTP under
# WASI/wazero, embedded by the Go module one directory up (Phase 3/4 of
# docs/plans/stack-encrypt-go-bindings.md).
#
# Deliberately a standalone workspace (same pattern as the fuzz crates and
# vitaminc's guest): this crate targets wasm32-wasip1 and is consumed as a
# .wasm artifact, so its wasm-only profile and target must not leak into
# workspace builds.
#
# Build: mise run wasm:guest:build   (or: cargo build --target wasm32-wasip1 --release)
[package]
name = "stack-encrypt-guest"
description = "WASI guest module exposing stack-encrypt to non-Rust hosts (Go/wazero)"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
# cdylib: the .wasm guest module. rlib: lets the ops/config/status modules
# unit-test natively (`cargo test` here, no wasm toolchain needed).
crate-type = ["cdylib", "rlib"]

[features]
# A TEST BUILD of the guest whose key source is the deterministic one the
# record fixture (packages/stack-encrypt/tests/fixtures/record_lowering.json)
# was sealed under: `se_cipher_init` takes the 32-byte seed and nothing
# else, and every data key derives from it. No ZeroKMS, no token, no
# network. The Go tests load it to open the fixture's records and to run
# hermetic round trips; `mise run wasm:guest:build:deterministic` builds it
# beside the real guest. Never the embedded guest.
deterministic-kms = ["stack-kms/test-support"]
# The guest build that holds the EQL types (ADR-0007, amended 2026-10-06):
# links eql-bindings and installs its by-name dispatch as the engine's
# `TargetResolver`, so a plan field may name an EQL type (`TextEq`) and
# `se_encrypt_record` returns the finished EQL value; `se_targets` lists the
# catalog. Off, the guest installs `NoTargets` and refuses every target name
# at `se_plan_check`. The Go module embeds both builds: `encrypt` the one
# without, `encrypt/eql` the one with, registered on import
# (`mise run wasm:guest:build:eql`). Combines with `deterministic-kms` for
# the hermetic Go tests of a TextEq field.
eql = ["dep:eql-bindings"]

[dependencies]
# The stack crates with default features off: no reqwest, no native TLS —
# HTTP comes from the host (see `wasm:wasi-check` in the suite root).
stack-auth = { path = "../../../../packages/stack-auth", default-features = false }
# `dynamic`: the runtime value model this guest speaks — contexts, index
# terms and record plans read from frames, shared with every other binding.
stack-encrypt = { path = "../../../../packages/stack-encrypt", default-features = false, features = ["dynamic"] }
# The guest ABI every guest under bindings/go shares: the allocator and
# buffer registry (and with them the `se_alloc`/`se_dealloc` exports), the
# packed-result helpers, the status table and the step loop.
# This crate defines only the exports that are its own.
stack-guest-abi = { path = "../../../../packages/stack-guest-abi" }
stack-kms = { path = "../../../../packages/stack-kms", default-features = false }
# The EQL types, for the `eql` build only. By path, like every other
# eql-bindings dependency in the repository: the SQL that stores a payload
# and the Rust that emits it must agree (scripts/lint-no-eql-registry-pins.mjs).
eql-bindings = { path = "../../../../packages/eql/crates/eql-bindings", features = ["targets"], optional = true }
zerokms-protocol = "=0.12.31"

# No vitaminc dependency of its own: the transport frame and ciphertext
# codec (`stack_encrypt::dynamic::frame`, vitaminc's own, shared with its
# guest), the value model and `Protected` all come through stack-encrypt's
# re-exports, so the guest cannot build against another vitaminc. Two
# versions would fail only at the `ValueFrame: Decrypt` bound.

futures = { version = "0.3", default-features = false, features = ["executor"] }
serde = "1"
serde_json = "1"
uuid = "1"
zeroize = "1"

[dev-dependencies]
stack-kms = { path = "../../../../packages/stack-kms", default-features = false, features = ["test-support"] }
# For minting a valid client-key fixture in the config tests.
recipher = "=0.3.1"
# Re-encoding that fixture into the other forms the config table promises
# (upper-case hex, base64) so the lenient decode is actually exercised.
base16ct = { version = "0.2.0", features = ["alloc"] }
base64ct = { version = "1.7", features = ["alloc"] }

# TEMPORARY: vitaminc from cipherstash/vitaminc#526 (head c226edf, stacked on
# #520), which adds the storage profile for kept values (Rust
# `vitaminc_aead_frame::storage`, Go `vcffi.MarshalStorage`). Both are
# unreleased. Every vitaminc crate this build resolves at 0.8 is patched to
# the one git revision, so no type is duplicated between a crates.io and a
# git copy. The repository root's Cargo.toml and the other Go guest carry the same
# block, and languages/golang/go.mod pins vcffi and vcvalue to the same
# commit. Replace all of them with the vitaminc release that ships #520/#526.
# (The 0.5 copies cipherstash-client pulls in are a separate semver line and
# are not patched.)
[patch.crates-io]
vitaminc = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-aead = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-aead-derive = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-aead-frame = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-context = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-encrypt = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-hmac = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-normalize = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-ore = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-prf = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-protected = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-protected-derive = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-random = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-random-derives = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }
vitaminc-traits = { git = "https://github.com/cipherstash/vitaminc", rev = "c226edfeaf436883018cbabe3f709860b269eca9" }

[profile.release]
# Smaller .wasm; the guest is IO-bound on the FFI copy and the ZeroKMS round
# trip, not on codegen.
opt-level = "s"
lto = true
strip = true
